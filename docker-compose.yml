services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: projeto_integrador
      DB_USER: root
      DB_PASSWORD: root
      SEED_ADMIN_PASSWORD: SenhaAdminDemo1
      SEED_CUSTOMER_PASSWORD: SenhaClienteDemo1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projeto_integrador
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - agencia_mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agencia_mysql_data:
